name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate Release Tag
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend Dependencies
        working-directory: web
        run: npm ci
      - name: Frontend Tests
        working-directory: web
        run: npm test
      - name: Frontend Build
        working-directory: web
        run: npm run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go Test
        run: go test ./...
      - name: Go Vet
        run: go vet ./...
      # All Go binaries embed the frontend built above, never a stale dist.
      - name: Cross Platform Build
        run: ./scripts/build-binaries.sh
      - name: Package and Generate SHA256SUMS
        run: ./scripts/package-release.sh
      # Checks/build/package failures stop the job before creating a release.
      # Keep it a draft until every asset has been uploaded successfully.
      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" \
            release/localchat-"$VERSION"-*.zip \
            release/localchat-"$VERSION"-*.tar.gz \
            release/SHA256SUMS.txt \
            --verify-tag --draft --generate-notes --title "LocalChat $VERSION"
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$VERSION" --draft=false --latest
